{% extends 'gestion_cdi/base.html' %}
{% block titulo %}Borrar Personal{% endblock %}
{% block contenido %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow border-danger">
            <div class="card-body text-center p-5">
                <h1 class="text-danger mb-4">⚠️ Advertencia</h1>
                <h4 class="mb-3">¿Eliminar del sistema a:</h4>
                <h2 class="text-dark fw-bold mb-4">{{ empleado.tipo_cedula }}-{{ empleado.cedula }} | {{ empleado.nombre }} {{ empleado.apellido }}?</h2>
                <form method="post">
                    {% csrf_token %}
                    <a href="{% url 'lista_personal' %}" class="btn btn-secondary px-4 me-2">Cancelar</a>
                    <button type="submit" class="btn btn-danger px-4">Eliminar Definitivamente</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
