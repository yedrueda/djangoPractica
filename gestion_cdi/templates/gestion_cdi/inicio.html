<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema CDI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
  <div class="container-fluid">
    <span class="navbar-brand mb-0 h1">Centro de Diagnóstico Integral (CDI)</span>
  </div>
</nav>

<div class="container mt-5">
    <h2 class="mb-4">Panel de Control Principal</h2>
    
    <div class="row">
        <div class="col-md-4">
            <div class="card text-white bg-success mb-3">
                <div class="card-body">
                    <h5 class="card-title">Pacientes Registrados</h5>
                    <p class="card-text fs-1">{{ total_pacientes }}</p>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card text-white bg-info mb-3">
                <div class="card-body">
                    <h5 class="card-title">Personal Activo</h5>
                    <p class="card-text fs-1">{{ total_personal }}</p>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card text-white bg-warning mb-3">
                <div class="card-body">
                    <h5 class="card-title">Equipos en Inventario</h5>
                    <p class="card-text fs-1">{{ total_equipos }}</p>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
