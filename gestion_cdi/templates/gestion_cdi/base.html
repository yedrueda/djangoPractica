<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}SIGE - CDI "El Llanito"{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-light: #f5f6fa;
            --text-dark: #2f3640;
            --text-muted: #718093;
            --accent-blue: #0097e6;
            --accent-green: #4cd137;
            --accent-orange: #e1b12c;
            --accent-red: #e84118;
            --sidebar-width: 260px;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            font-family: 'Roboto', sans-serif;
            overflow-x: hidden;
        }

        /* ==========================================
           ESTILOS DEL CONTENEDOR Y SIDEBAR
           ========================================== */
        #wrapper {
            display: flex;
            width: 100%;
            align-items: stretch;
        }

        #sidebar-wrapper {
            min-width: var(--sidebar-width);
            max-width: var(--sidebar-width);
            min-height: 100vh;
            background-color: #ffffff;
            box-shadow: 2px 0 5px rgba(0,0,0,0.05);
            transition: margin 0.25s ease-out;
            z-index: 1000;
        }

        /* Ocultar sidebar al presionar el botón */
        body.sb-sidenav-toggled #sidebar-wrapper {
            margin-left: calc(var(--sidebar-width) * -1);
        }

        #page-content-wrapper {
            min-width: 0;
            width: 100%;
        }

        /* Estilos de los enlaces del Sidebar */
        .sidebar-heading {
            padding: 1.5rem 1.25rem;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #f1f2f6;
        }

        .list-group-item {
            border: none;
            padding: 1rem 1.25rem;
            color: var(--text-muted);
            font-weight: 500;
            transition: all 0.2s;
        }

        .list-group-item:hover, .list-group-item.active {
            color: var(--accent-blue);
            background-color: #f8f9fa;
            border-left: 4px solid var(--accent-blue);
        }

        .list-group-item i { width: 25px; }

        /* Submenú desplegable */
        .collapse-inner { background-color: #f8f9fa; border-radius: 8px; }
        .collapse-item { color: var(--text-muted); font-size: 0.9rem; transition: color 0.2s; }
        .collapse-item:hover { color: var(--text-dark); background-color: #eaebf0; }

        /* ==========================================
           ESTILOS DEL TOPBAR Y CONTENIDO
           ========================================== */
        .topbar {
            background-color: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            height: 70px;
        }

        .content-wrapper { padding: 30px; }

        /* Estilos de las Tarjetas Generales */
        .card { border: none; border-radius: 8px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.04); }
        h1, h2, h3, h4, h5 { font-weight: 500; color: var(--text-dark); }

        /* Para pantallas de celular */
        @media (max-width: 768px) {
            #sidebar-wrapper { margin-left: calc(var(--sidebar-width) * -1); }
            body.sb-sidenav-toggled #sidebar-wrapper { margin-left: 0; }
        }
    </style>
</head>
<body>

    <div id="wrapper">
        
        <div id="sidebar-wrapper">
            <div class="sidebar-heading text-dark">
                <i class="fa-solid fa-notes-medical" style="color: var(--accent-blue);"></i> SIGE | CDI
            </div>
            
            <div class="list-group list-group-flush mt-3">
                <a class="list-group-item list-group-item-action bg-white" href="{% url 'inicio' %}">
                    <i class="fa-solid fa-chart-pie"></i> Panel General
                </a>
                
                <a class="list-group-item list-group-item-action bg-white" href="{% url 'lista_pacientes' %}">
                    <i class="fa-solid fa-users"></i> Directorio Pacientes
                </a>
                
                <a class="list-group-item list-group-item-action bg-white" href="{% url 'lista_personal' %}">
                    <i class="fa-solid fa-user-doctor"></i> Talento Humano
                </a>
                
                <a class="list-group-item list-group-item-action bg-white" href="{% url 'lista_equipos' %}">
                    <i class="fa-solid fa-boxes-stacked"></i> Inventario Bienes
                </a>

                <a class="list-group-item list-group-item-action bg-white d-flex justify-content-between align-items-center" data-bs-toggle="collapse" href="#collapseSalud" role="button" aria-expanded="false" aria-controls="collapseSalud">
                    <div><i class="fa-solid fa-heart-pulse"></i> Módulo Clínico</div>
                    <i class="fa-solid fa-angle-down" style="font-size: 12px; width: auto;"></i>
                </a>
                <div class="collapse" id="collapseSalud">
                    <div class="collapse-inner mx-3 mb-2 py-2">
                        <a class="collapse-item text-decoration-none d-block py-2 px-3" href="{% url 'lista_consultas' %}">Historial Médico</a>
                        
                        <a class="collapse-item text-decoration-none d-block py-2 px-3 fw-bold text-primary" href="{% url 'seleccionar_programa' %}">+ Nueva Evaluación</a>
                    </div>
                </div>
                
                
                <div class="mt-5 px-4 text-center">
                    <span class="badge bg-light text-muted border border-secondary p-2 w-100">Versión 1.0</span>
                </div>
            </div>
        </div>
        <div id="page-content-wrapper">
            
            <nav class="navbar navbar-expand-lg navbar-light topbar px-4 border-bottom">
                <div class="d-flex align-items-center w-100">
                    <button class="btn btn-light border-0 shadow-sm me-3" id="sidebarToggle">
                        <i class="fa-solid fa-bars text-muted"></i>
                    </button>
                    
                    <span class="text-muted small d-none d-md-block">Sistema de Gestión Integral para el ASIC Río de Janeiro</span>

                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle text-dark fw-bold d-flex align-items-center" id="navbarDropdown" href="#" role="button" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                                <div class="bg-primary text-white rounded-circle d-flex justify-content-center align-items-center me-2" style="width: 32px; height: 32px; font-size: 14px;">
                                    <i class="fa-solid fa-user"></i>
                                </div>
                                Administrador
                            </a>
                            <div class="dropdown-menu dropdown-menu-end shadow border-0 mt-2" aria-labelledby="navbarDropdown">
                                <a class="dropdown-item" href="#"><i class="fa-solid fa-gear me-2 text-muted"></i> Configuración</a>
                                <div class="dropdown-divider"></div>
                                <a class="dropdown-item text-danger fw-bold" href="#"><i class="fa-solid fa-right-from-bracket me-2"></i> Cerrar Sesión</a>
                            </div>
                        </li>
                    </ul>
                </div>
            </nav>
            <div class="container-fluid content-wrapper">
                {% block contenido %}{% endblock %}
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', event => {
            const sidebarToggle = document.body.querySelector('#sidebarToggle');
            if (sidebarToggle) {
                sidebarToggle.addEventListener('click', event => {
                    event.preventDefault();
                    document.body.classList.toggle('sb-sidenav-toggled');
                });
            }
        });
    </script>
</body>
</html>
